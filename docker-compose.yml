services:
  postgres:
    image: postgres:17
    container_name: knowledgehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledgehub
      POSTGRES_PASSWORD: knowledgehub_dev
      POSTGRES_DB: knowledgehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: